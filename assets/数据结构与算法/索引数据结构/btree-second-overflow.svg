<svg xmlns="http://www.w3.org/2000/svg" width="820" height="260" viewBox="0 0 820 260" role="img" aria-labelledby="title desc">
  <title id="title">B树叶子节点再次溢出</title>
  <desc id="desc">继续插入23、25、39后，左叶子节点超过4个关键字上限，需要再次分裂。</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.root{fill:#fff;stroke:#2563eb;stroke-width:2}.overflow{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.leaf{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.text{font:600 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.hint{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.edge{stroke:#64748b;stroke-width:2;fill:none}
    </style>
  </defs>
  <rect class="bg" width="820" height="260" rx="14"/>
  <text x="410" y="36" text-anchor="middle" class="text">继续插入 23、25、39：左叶子溢出</text>
  <rect class="root" x="360" y="62" width="100" height="50" rx="8"/>
  <text x="410" y="95" text-anchor="middle" class="text">40</text>
  <path class="edge" d="M385 112 L270 160"/>
  <path class="edge" d="M435 112 L575 160"/>
  <rect class="overflow" x="120" y="160" width="300" height="54" rx="8"/>
  <rect class="leaf" x="500" y="160" width="150" height="54" rx="8"/>
  <text x="270" y="194" text-anchor="middle" class="text">18 | 22 | 23 | 25 | 39</text>
  <text x="575" y="194" text-anchor="middle" class="text">50 | 70</text>
  <text x="410" y="238" text-anchor="middle" class="hint">左叶子有5个关键字，超过5阶B树节点上限</text>
</svg>
