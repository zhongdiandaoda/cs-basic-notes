<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="520" viewBox="0 0 1050 520"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#172033}.n{fill:#eef6ff;stroke:#3478c8;stroke-width:2;rx:8}.h{fill:#fff4cc;stroke:#d59b18;stroke-width:2;rx:8}.t{font-size:15px;text-anchor:middle}.s{font-size:13px;text-anchor:middle;fill:#526176}.l{stroke:#64748b;stroke-width:2;marker-end:url(#a)}</style><text x="525" y="28" class="t" font-weight="700">红黑树删除修复：处理临时的 double black</text><rect x="400" y="55" width="250" height="42" class="n"/><text x="525" y="82" class="t">删除节点</text><rect x="70" y="135" width="210" height="54" class="h"/><text x="175" y="160" class="t">被删节点为 RED？</text><text x="175" y="179" class="s">是：直接删除</text><rect x="420" y="135" width="210" height="54" class="h"/><text x="525" y="160" class="t">替代节点为 RED？</text><text x="525" y="179" class="s">是：染 BLACK</text><rect x="770" y="135" width="210" height="54" class="h"/><text x="875" y="160" class="t">否则产生 double black</text><rect x="770" y="260" width="210" height="60" class="n"/><text x="875" y="286" class="t">兄弟为 RED？</text><text x="875" y="306" class="s">染黑、父染红并旋转</text><rect x="500" y="390" width="210" height="60" class="n"/><text x="605" y="416" class="t">兄弟为 BLACK</text><text x="605" y="436" class="s">按孩子颜色继续判断</text><rect x="30" y="390" width="190" height="60" class="n"/><text x="125" y="416" class="t">两孩子均 BLACK</text><text x="125" y="436" class="s">兄弟染红，问题上移</text><rect x="280" y="390" width="170" height="60" class="n"/><text x="365" y="416" class="t">远端孩子 BLACK</text><text x="365" y="436" class="s">先旋转兄弟</text><rect x="760" y="390" width="230" height="60" class="n"/><text x="875" y="416" class="t">远端孩子 RED</text><text x="875" y="436" class="s">旋转父节点并染色</text><path d="M445 97 L175 135 M525 97 L525 135 M605 97 L875 135 M875 189 L875 260 M875 320 L605 390 M605 450 L125 390 M605 450 L365 390 M605 450 L875 390" class="l"/><text x="525" y="500" class="s">修复结束，恢复根黑、无连续红节点、路径黑高一致</text></svg>
