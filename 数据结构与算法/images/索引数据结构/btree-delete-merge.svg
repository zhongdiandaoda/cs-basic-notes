<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="350" viewBox="0 0 1080 350"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#172033}.n{fill:#eef6ff;stroke:#3478c8;stroke-width:2;rx:8}.h{fill:#fff4cc;stroke:#d59b18;stroke-width:2;rx:8}.t{font-size:16px;text-anchor:middle}.s{font-size:13px;text-anchor:middle;fill:#526176}.l{stroke:#64748b;stroke-width:2;marker-end:url(#a)}</style><text x="540" y="28" class="t" font-weight="700">借不到时合并：父节点分隔关键字下移</text><text x="220" y="65" class="s">调整前</text><rect x="130" y="85" width="180" height="50" class="n"/><text x="220" y="116" class="t">24 | 50</text><rect x="35" y="220" width="150" height="50" class="n"/><text x="110" y="251" class="t">10 | 18</text><rect x="200" y="220" width="100" height="50" class="h"/><text x="250" y="251" class="t">40</text><rect x="315" y="220" width="180" height="50" class="n"/><text x="405" y="251" class="t">60 | 70</text><path d="M180 135 L110 220 M220 135 L250 220 M265 135 L405 220" class="l"/><text x="540" y="165" class="t">下移 50 并合并</text><path d="M500 175 L590 175" class="l"/><text x="850" y="65" class="s">调整后</text><rect x="760" y="85" width="180" height="50" class="n"/><text x="850" y="116" class="t">24</text><rect x="665" y="220" width="150" height="50" class="n"/><text x="740" y="251" class="t">10 | 18</text><rect x="830" y="220" width="235" height="50" class="h"/><text x="947" y="251" class="t">40 | 50 | 60 | 70</text><path d="M810 135 L740 220 M890 135 L947 220" class="l"/><text x="540" y="320" class="s">当前节点、父节点分隔关键字和兄弟节点合成一个节点</text></svg>
