<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#172033}.box{fill:#eef6ff;stroke:#3478c8;stroke-width:2;rx:8}.hi{fill:#fff4cc;stroke:#d59b18;stroke-width:2;rx:8}.t{font-size:16px;text-anchor:middle}.s{font-size:14px;text-anchor:middle;fill:#526176}.l{stroke:#64748b;stroke-width:2;marker-end:url(#a)}</style><text x="550" y="25" class="t" font-weight="700">父节点为 2-节点时插入 5</text><rect x="40" y="95" width="150" height="55" class="box"/><text x="115" y="129" class="t">8（根）</text><rect x="30" y="210" width="130" height="55" class="box"/><text x="95" y="244" class="t">4</text><rect x="200" y="210" width="130" height="55" class="box"/><text x="265" y="244" class="box">12 | 14</text><path d="M115 150 L95 210 M160 150 L265 210" class="l"/><rect x="390" y="95" width="200" height="55" class="hi"/><text x="490" y="129" class="t">4 | 5 | 6（临时）</text><rect x="690" y="95" width="170" height="55" class="box"/><text x="775" y="129" class="t">4 | 6</text><rect x="640" y="210" width="100" height="55" class="box"/><text x="690" y="244" class="t">5</text><rect x="790" y="210" width="100" height="55" class="box"/><text x="840" y="244" class="t">7</text><path d="M590 122 L680 122 M775 150 L690 210 M775 150 L840 210" class="l"/><text x="285" y="175" class="s">插入</text><text x="635" y="175" class="s">中间 key 6 上移到父节点</text><text x="550" y="305" class="s">分裂后：父节点从 2-节点变为 3-节点</text></svg>
