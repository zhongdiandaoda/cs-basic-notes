<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-labelledby="title desc">
  <title id="title">B树删除内部节点时使用后继替换</title>
  <desc id="desc">删除内部节点22时，用后继关键字24覆盖22，再到后继所在叶子节点删除24。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
    <style>
      .bg{fill:#f8fafc}.node{fill:#fff;stroke:#2563eb;stroke-width:2}.leaf{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.under{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.text{font:600 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.hint{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.edge{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="900" height="230" rx="14"/>
  <text x="450" y="34" text-anchor="middle" class="text">删除内部关键字 22：使用后继 24 替换</text>
  <rect class="node" x="92" y="72" width="170" height="52" rx="8"/>
  <text x="177" y="105" text-anchor="middle" class="text">根: 22 | 40</text>
  <path class="edge" d="M280 98 L390 98"/>
  <text x="335" y="82" text-anchor="middle" class="hint">24 覆盖 22</text>
  <rect class="node" x="410" y="72" width="170" height="52" rx="8"/>
  <text x="495" y="105" text-anchor="middle" class="text">根: 24 | 40</text>
  <path class="edge" d="M600 98 L710 98"/>
  <text x="655" y="82" text-anchor="middle" class="hint">叶子删 24</text>
  <rect class="under" x="730" y="72" width="110" height="52" rx="8"/>
  <text x="785" y="105" text-anchor="middle" class="text">26</text>
  <text x="450" y="178" text-anchor="middle" class="hint">后继所在叶子只剩1个关键字，低于下限，需要继续修复</text>
</svg>
