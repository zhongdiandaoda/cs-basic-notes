<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#172033}.n{fill:#eef6ff;stroke:#3478c8;stroke-width:2;rx:8}.h{fill:#fff4cc;stroke:#d59b18;stroke-width:2;rx:8}.t{font-size:16px;text-anchor:middle}.s{font-size:14px;text-anchor:middle;fill:#526176}.l{stroke:#64748b;stroke-width:2;marker-end:url(#a)}</style><text x="460" y="28" class="t" font-weight="700">左倾红黑树插入修复流程</text><rect x="330" y="55" width="260" height="44" class="n"/><text x="460" y="83" class="t">插入新节点并标记为 RED</text><rect x="65" y="150" width="220" height="58" class="h"/><text x="175" y="176" class="t">右孩子红、左孩子黑？</text><text x="175" y="196" class="s">是：左旋</text><rect x="350" y="150" width="220" height="58" class="h"/><text x="460" y="176" class="t">左孩子与左孙子都红？</text><text x="460" y="196" class="s">是：右旋</text><rect x="635" y="150" width="220" height="58" class="h"/><text x="745" y="176" class="t">左右孩子都红？</text><text x="745" y="196" class="s">是：颜色翻转</text><rect x="350" y="290" width="220" height="48" class="n"/><text x="460" y="320" class="t">继续向根节点检查</text><rect x="350" y="380" width="220" height="40" class="n"/><text x="460" y="406" class="t">根节点最终设为 BLACK</text><path d="M395 99 L175 150 M460 99 L460 150 M525 99 L745 150 M285 179 L350 179 M570 179 L635 179 M745 208 L570 290 M460 208 L460 290 M175 208 L350 290" class="l"/><path d="M460 338 L460 380" class="l"/></svg>
